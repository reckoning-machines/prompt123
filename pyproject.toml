[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt123"
version = "0.0.1"
description = "A governed prompt proofing and governance substrate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["prompt123"]

[tool.pytest.ini_options]
testpaths = ["tests"]
